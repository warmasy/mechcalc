site_name: mechcalc 机械工程计算库
site_description: 基于 pint 的机械工程计算库——惯量、三维运动、气动、电机计算
docs_dir: docs
repo_url: https://github.com/mechcalc/mechcalc
repo_name: mechcalc/mechcalc

theme:
  name: material
  language: zh
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      accent: cyan
      toggle:
        icon: material/brightness-2
        name: "切换到浅色模式"
    - scheme: default
      accent: indigo
      toggle:
        icon: material/brightness-5
        name: "切换到暗色模式"
  font:
    text: Noto Sans
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.tracking
    - navigation.tabs
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.code.copy
    - toc.follow
    - announce.dismiss

nav:
  - 首页: index.md
  - 使用指南:
      - 快速开始: guide/quickstart.md
      - 单位系统: guide/units.md
  - 计算原理:
      - 惯量计算: theory/inertia.md
      - 惯性张量入门教程: theory/inertia_tensor_guide.md
      - 三维运动: theory/motion3d.md
      - 气动计算: theory/pneumatic.md
  - API 参考:
      - 惯量 inertia: api/inertia.md
      - 基础力学 basic: api/basic.md
      - 气动 pneumatic: api/pneumatic.md
      - 电机 electric: api/electric.md
      - 核心工具 core: api/core.md
      - 通用工具 utils: api/utils.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 mechcalc
