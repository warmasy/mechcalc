[project]
name = "mechcalc"
version = "0.1.0"
description = "机械工程计算库 - 基于 pint 的惯量（标量+张量）、三维运动、气缸、电机计算"
requires-python = ">=3.11"
dependencies = [
    "pint>=0.25",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mechcalc = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # 行长由 line-length=100 控制，docstring 含公式不强制换行
    "E741",   # l1/l2/a/b 等是《机械设计手册》标准参数名，I 是惯量张量惯例命名
    "SIM105", # 保持显式 try/except 风格
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM108"]

