[project]
name = "mechcalc"
version = "0.1.0"
description = "机械工程计算库 - 基于 pint 的惯量（标量+张量）、三维运动、气缸、电机计算"
requires-python = ">=3.11"
dependencies = [
    "pint>=0.25",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
